name: mgl_call
description: Reusable WebRTC audio/video call library for Flutter + ClojureDart.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.2.0
  permission_handler: ^11.3.1
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
