name: mgl_push
description: Cross-platform push client for mgl-push (Flutter MethodChannel wrapper).
version: 0.1.0
homepage: https://github.com/amjil/mgl-push

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.2
  device_info_plus: ^11.1.0
  ulid: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.amjil.mglpush
        pluginClass: MglPushPlugin
      ios:
        pluginClass: MglPushPlugin
